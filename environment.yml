# conda alternative to requirements.txt: conda env create -f environment.yml
name: frost
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy=2.4.4
  - pandas=3.0.2
  - scipy=1.17.1
  - scikit-learn=1.8.0  # indirect, via hmmlearn
  - pyyaml=6.0.2
  - pytest=8.3.4
  - pip
  - pip:
      - hmmlearn==0.3.3
      - -e .
