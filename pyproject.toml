[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coldspots"
version = "1.0.0"
description = "FROST (Find Regions Of Substitution Tolerance): mutational cold-spot detection with a two-state Gaussian HMM"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "TODO: author name"}]
keywords = ["variant effect prediction", "hidden markov model", "BRCA1", "MAVE"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "hmmlearn>=0.3.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
coldspots = "coldspots.cli:main"

[project.urls]
Repository = "https://github.com/mariam16548/FROST"

[tool.setuptools]
packages = ["coldspots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
