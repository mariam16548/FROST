# Smoke test on synthetic data:
#
#   python scripts/make_synthetic_data.py
#   frost --config config/synthetic.yaml
#
# Same as config/default.yaml except for the input path and output location.

data:
  # One row per missense substitution, with per-residue feature scores.
  variant_csv: data/synthetic/variants.csv.gz

columns:
  gene: gene_symbol
  transcript: transcript_id   # copied into the regions table
  # The amino-acid position is parsed from protein_variant (e.g. "C2R" -> 2)
  # unless the table has an aa_pos column.
  aa_pos: aa_pos
  protein_variant: protein_variant
  # Shipped in the table with the published calls; never read.
  drop_precomputed: [variant_in_coldspot, gene_has_coldspot]
  # Used only by the optional evaluation.
  clinvar: CLNSIG
  mave: functional_assignment

features:
  # Most deleterious value per residue. The first feature defines the Cold
  # state (lower mean AlphaMissense).
  primary: [max_AlphaMissense, min_ESM1b, max_EVE, max_phyloP]
  # Genes with any position lacking EVE use the other three features.
  fallback_drop: [max_EVE]
  # ESM1b is sign-inverted so that higher = more deleterious for all features.
  invert: [min_ESM1b]
  # Clipped to the 1st and 99th percentiles, then min-max scaled per gene.
  winsorize: [1.0, 99.0]

training:
  # BRCA1 positions 224-1366 are Cold; all other BRCA1 positions Not-Cold.
  intervals:
    BRCA1: [[224, 1366]]
  # The training gene is never decoded or evaluated.
  exclude_genes: [BRCA1]

detection:
  # Cold runs spanning fewer than 40 positions are reassigned to Not-Cold.
  min_cold_run: 40

evaluation:
  # Optional ClinVar / MAVE odds ratios (turn on here or with --evaluate).
  enabled: false
  # A gene enters the MAVE evaluation if its abnormal/normal calls cover at
  # least this many distinct positions inside its cold spots, summed across
  # all of its cold spots.
  min_mave_positions: 10
  # canonical name: label as it appears in the data
  clinvar_labels: {PLP: PLP, BLB: BLB, VUS: VUS}
  mave_labels: {PLP: Abnormal, BLB: Normal, IR: Indeterminate}

output:
  dir: results/synthetic
  prefix: coldspots_synthetic
