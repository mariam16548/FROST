# Sensitivity analysis: pseudo-replication control.
#
# Turns on the (optional) ClinVar / MAVE evaluation and differs from the
# evaluation settings in config/default.yaml in exactly two places:
#   evaluation.unit              variant  -> position
#   evaluation.mave_filter_level gene     -> interval
# The cold-spot regions are the same as with config/default.yaml.
#
# Rationale: the input table holds one row per substitution, so a residue with
# several classified substitutions contributes several rows to Fisher's exact
# test as if they were independent observations. `unit: position` collapses to
# one observation per (gene, aa_pos, label). `mave_filter_level: interval`
# additionally requires each cold spot to carry its own assay support rather
# than inheriting it from elsewhere in the gene.

data:
  # The single input table: one row per missense substitution, with
  # per-residue predictor scores, ClinVar calls and MAVE calls.
  variant_csv: data/variant_level_coldspots.csv.gz

columns:
  clinvar: CLNSIG
  mave: functional_assignment
  # Fallbacks tried in order if `mave` is absent; the resolved name is recorded
  # in the run manifest.
  mave_candidates:
    - functional_assignment
    - ExC_assignment
    - assignment
    - mave_assignment
    - MAVE_assignment
    - mave_class
    - MAVE_class
  gene: gene_symbol
  transcript: transcript_id   # copied into the regions table
  # Parsed from protein_variant (e.g. "C2R" -> 2) when the table has no
  # aa_pos column.
  aa_pos: aa_pos
  protein_variant: protein_variant
  # Never read, so membership is always recomputed from this run.
  drop_precomputed: [variant_in_coldspot, gene_has_coldspot, in_coldspot, in_coldspot_bw]

features:
  # Per-residue scores. Order matters: the first feature defines the cold state.
  primary: [max_AlphaMissense, min_ESM1b, max_EVE, max_phyloP]
  # Marginalised out to build the fallback model for genes with any missing
  # value of these scores.
  fallback_drop: [max_EVE]
  # Sign-flipped so that higher == more damaging for every feature.
  invert: [min_ESM1b]
  winsorize: [1.0, 99.0]

training:
  # Amino-acid intervals labelled cold when estimating parameters.
  intervals:
    BRCA1: [[224, 1366]]
  # Never decoded; removed from both evaluation sets.
  exclude_genes: [BRCA1]

detection:
  min_cold_run: 40

evaluation:
  # Optional ClinVar / MAVE enrichment analysis (odds ratios). The settings
  # below only matter when it is on. Turn on here or with --evaluate.
  enabled: true
  min_class_count: 0        # 0 = no ClinVar gene filter
  min_mave_positions: 10
  min_mave_coverage: 0.0    # 0 = off
  mave_filter_level: interval  # gene | interval
  unit: position            # variant (primary) | position (sensitivity)
  # canonical name: label as it appears in the data
  clinvar_labels: {PLP: PLP, BLB: BLB, VUS: VUS}
  mave_labels: {PLP: Abnormal, BLB: Normal, IR: Indeterminate}

output:
  dir: results
  prefix: coldspots_position_level
  variant_table: false       # per-variant gene_has_coldspot / variant_in_coldspot
  write_pickle: false

seed: 42
